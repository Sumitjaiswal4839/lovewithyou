services:
  redis:
    image: redis:7-alpine
    container_name: dating_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  ml_service:
    build:
      context: ./ml_service
    container_name: dating_ml_service
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - FLASK_ENV=production

  frontend:
    build:
      context: ./dating-pwa
    container_name: dating_frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    env_file:
      - ./dating-pwa/.env.local
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8080

  backend:
    build:
      context: ./backend
    container_name: dating_backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - redis
      - ml_service
    env_file:
      - ./backend/.env

  nginx:
    image: nginx:latest
    container_name: dating_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  redis_data:
  prometheus_data:
  grafana-storage:
